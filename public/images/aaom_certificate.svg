<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="50%" stop-color="#f3e5ab"/>
      <stop offset="100%" stop-color="#8b6508"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fcfbf7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="700" fill="url(#bgGrad)"/>

  <!-- Outer Ornate Diploma Border -->
  <rect x="25" y="25" width="950" height="650" fill="none" stroke="url(#gold)" stroke-width="12" rx="6"/>
  <rect x="42" y="42" width="916" height="616" fill="none" stroke="#00243d" stroke-width="2" stroke-dasharray="10 5"/>
  <rect x="50" y="50" width="900" height="600" fill="none" stroke="#00243d" stroke-width="1"/>

  <!-- USA Flag & International Seal Badge -->
  <g transform="translate(820, 70)">
    <rect x="0" y="0" width="60" height="36" fill="#b22234" rx="3"/>
    <rect x="0" y="5.5" width="60" height="5.5" fill="#ffffff"/>
    <rect x="0" y="16.5" width="60" height="5.5" fill="#ffffff"/>
    <rect x="0" y="27.5" width="60" height="5.5" fill="#ffffff"/>
    <rect x="0" y="0" width="24" height="22" fill="#3c3b6e" rx="2 0 0 0"/>
    <circle cx="6" cy="5" r="1.2" fill="#ffffff"/>
    <circle cx="18" cy="5" r="1.2" fill="#ffffff"/>
    <circle cx="12" cy="11" r="1.2" fill="#ffffff"/>
    <circle cx="6" cy="17" r="1.2" fill="#ffffff"/>
    <circle cx="18" cy="17" r="1.2" fill="#ffffff"/>
    <text x="30" y="52" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#00243d" text-anchor="middle">USA 🇺🇸</text>
  </g>

  <!-- AAOM Emblem Header -->
  <text x="500" y="115" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#b8860b" text-anchor="middle" letter-spacing="3">AAOM</text>
  <text x="500" y="142" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#00243d" text-anchor="middle" letter-spacing="2">AMERICAN ASSOCIATION OF ORTHOPAEDIC MEDICINE</text>

  <line x1="280" y1="160" x2="720" y2="160" stroke="url(#gold)" stroke-width="2"/>

  <!-- Certify Text -->
  <text x="500" y="210" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#334155" text-anchor="middle" letter-spacing="4">THIS IS TO CERTIFY THAT</text>

  <!-- Doctor Name -->
  <text x="500" y="280" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="1">OMAR PAJARES TEQUÉN, MD</text>
  <line x1="200" y1="300" x2="800" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Description Body -->
  <text x="500" y="348" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#475569" text-anchor="middle">has successfully completed the prescribed course of study, written examination</text>
  <text x="500" y="376" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#475569" text-anchor="middle">and practical testing for the designation of</text>

  <!-- Designation Highlight -->
  <rect x="270" y="405" width="460" height="52" fill="#00243d" rx="8" filter="url(#shadow)"/>
  <rect x="274" y="409" width="452" height="44" fill="none" stroke="url(#gold)" stroke-width="2" rx="6"/>
  <text x="500" y="440" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">IROM — C CERTIFIED</text>

  <text x="500" y="492" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#00243d" text-anchor="middle">Interventional Regenerative Orthopedic Medicine</text>
  <text x="500" y="518" font-family="Georgia, serif" font-size="15" fill="#64748b" text-anchor="middle">by the American Academy / Association of Orthopaedic Medicine</text>

  <!-- Gold Stamp / Seal Bottom Left -->
  <g transform="translate(130, 555)">
    <circle cx="38" cy="38" r="38" fill="url(#gold)"/>
    <circle cx="38" cy="38" r="32" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="38" y="34" font-family="Georgia, serif" font-size="10" font-weight="bold" fill="#00243d" text-anchor="middle">OFFICIAL</text>
    <text x="38" y="46" font-family="Georgia, serif" font-size="9" font-weight="bold" fill="#00243d" text-anchor="middle">SEAL</text>
  </g>

  <!-- Date -->
  <text x="320" y="590" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#334155">Date of Certification:</text>
  <text x="320" y="612" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#0f172a">October 16, 2019</text>

  <!-- Signatures Right -->
  <g transform="translate(620, 570)">
    <path d="M10 20 Q 40 -10, 80 25 T 140 10" fill="none" stroke="#00243d" stroke-width="2"/>
    <line x1="0" y1="30" x2="220" y2="30" stroke="#94a3b8" stroke-width="1"/>
    <text x="110" y="48" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">AAOM Board &amp; Certification</text>
    <text x="110" y="64" font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">United States of America</text>
  </g>
</svg>
